    <style>
  #spinner {
    background: var(--app-bg, #fff);
    inset: 0;
    position: fixed;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 100000;
  }

  #innaThaSpinner {
    inset: 0;
    position: absolute;
  }

  .provider-logo { 
    block-size: 6rem;
    inline-size: 3.9rem;
    inset: 50% auto auto 50%;
    position: fixed;
    transform: translate(-50%, -50%); 
  }

  .spinner-path {
    block-size: 10rem;
    inline-size: 10rem;
    inset: 50% auto auto 50%;
    position: relative;
    transform: translate(-50%, 0);
  }

  .spinner-path > * {
    animation: spinner 3s infinite;
  }

  .spinner-path > *:after {
    block-size: 1.4rem;
    border-radius: 50%;
    content: '';
    display: block;
    inline-size: 1.4rem;
    position: absolute;
  }

  .spinner-path > *:nth-child(1) {
    animation-delay: .5s;
  }

  .spinner-path > *:nth-child(1):after {
    background: #F17B2D;
  }

  .spinner-path > *:nth-child(2) {
    animation-delay: 1s;
  }

  .spinner-path > *:nth-child(2):after {
    background: #F17B2D;
  }

  .spinner-path > *:nth-child(3) {
    animation-delay: 1.5;
  }

  .spinner-path > *:nth-child(3):after {
    background: #F17B2D;
  }

  .spinner-path > *:nth-child(4) {
    animation-delay: 2s;
  }

  .spinner-path > *:nth-child(4):after {
    background: #F17B2D;
  }

  @keyframes spinner {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
</style>

          { 'no-number': !source.meta.number },
          { 'hints-showing': modals.visible.indexOf('hintsMenu') >= 0 }]">

<script>
vm.component('component-cell', {
  template: '<g class="cell-group" :class="[...classes, clusterClass]" :style="{ \'--cell-step\': cellStep }" @click.stop.prevent="click">   <rect     role="cell"     class="cell"     :x="col * 100"     :y="row * 100"     :aria-label="isBlank ? $root.lang.grid_cell_blank : $root.lang.grid_cell"     :highlighted="isCurrent"     :aria-colindex="col + 1"     :aria-rowindex="row + 1"     width="100"     height="100"     shape-rendering="crispEdges">   </rect>    <text class="cell-number" :x="(col * 100) + 3" :y="(row * 100) + 25" text-anchor="start">     {{ clueNumber }}   </text>    <text class="cell-letter" :x="(col * 100) + 50" :y="(row * 100) + 75" text-anchor="middle">     {{ display }}   </text>    <path     v-if="isRevealed"     class="cell-revealed"     :d="\'M \' + (col * 100 + 100) + \' \' + (row * 100 + 78) + \' V \' + (row * 100 + 100) + \' H \' + (col * 100 + 78) + \' Z\'"     aria-hidden="true"></path>    <rect     class="cell-underline"     :x="col * 100 + 10"     :y="row * 100 + 90"     width="80"     height="4"     aria-hidden="true">   </rect>    <line     v-if="classes.includes(\'incorrect\')"     class="cell-strikethrough"     :x1="col * 100 + 10"     :y1="row * 100 + 90"     :x2="col * 100 + 90"     :y2="row * 100 + 10"     aria-hidden="true"></line> </g> ',
  props: ['cell', 'row', 'col', 'idx'],
  computed: {
    cellStep() {
      const cells = app.puzzle.cells;
      const cols = cells[0].length;
      const last = this.$root.active.cell;
      const lastRow = last === null || last === undefined ? (cells.length - 1) / 2 : Math.floor(last / cols);
      const lastCol = last === null || last === undefined ? (cols - 1) / 2 : last % cols;

      return Math.abs(this.row - lastRow) + Math.abs(this.col - lastCol);
    },
    classes() {
      const classes = [];

      if (this.isCurrent) {
        classes.push('selected');
      }

      if (this.isGiven) {
        classes.push('given');
      }

      if (this.isWordSelected) {
        classes.push('selected-word');
      }

      if (this.hintRole) {
        classes.push('helper-' + this.hintRole);
      }

      const partner = this.$root.mp_partner;
      if (partner?.number && +this.cell.clueNumber === partner.number) {
        classes.push(`mp-p${partner.index}-word`);
      }

      if (this.isGridBeingChecked && this.isCompleted) {
        if (this.isCorrect) {
          classes.push('correct');
        } else {
          classes.push('incorrect');
        }
      }

      if (this.isCellBeingChecked && this.display !== ' ') {
        if (this.isCorrect) {
          classes.push('correct');
          if (app.vue.data.check.letter === this.cell.id) {
            app.vue.data.blind.letterCorrect = true;

            setTimeout(() => {
              app.vue.data.blind.letterCorrect = false;
            }, 2000);
          } else if (!this.$root.check.letters[0].includes(this.cell.id)) {
            classes.push('incorrect');
          }
        } else {
          classes.push('incorrect');
        }
      } else if (this.isAutoCheckedWrong) {
        classes.push('incorrect');
      }

      if (this.$root.modes.notes && this.isCurrent) {
        classes.push('pencil');
      }

      return classes;
    },
    styleGivenClueData() {
      return '';
    },
    clusterClass() {
      if (this.isBlank) {
        return 'blank';
      } else {
        return this.cell.type;
      }
    },
    isGridBeingChecked() {
      return this.$root.check.grid;
    },
    isCellBeingChecked() {
      if (this.$root.check.letters[0]) {
        return this.$root.check.letters[0].includes(this.cell.id);
      } else {
        return this.$root.check.letter === this.cell.id;
      }
    },
    isBeingRevealed() {
      return this.$root.reveal.grid;
    },
    isBlank() {
      return this.cell.type === 'blank';
    },
    isCurrent() {
      if (this.$root.active.cells) {
        const exists = this.$root.active.cells[0].some(f => f === this.cell.id);

        return exists === true;
      } else {
        return this.$root.active.cell === this.cell.id;
      }
    },
    isCompleted() {
      return this.$root.userString[parseInt(this.cell.clueNumber) - 1] !== ' ';
    },
    isRevealed() {
      if (this.isGiven || !this.isCompleted || !this.isCorrect) return false;

      const user = this.$root.user;
      const number = +this.cell.clueNumber;

      return (
        (user.prefilledCells || []).includes(number) ||
        (user.revealedNumbers || []).includes(number) ||
        (this.$root.mp_marked_numbers || []).includes(number)
      );
    },
    isCorrect() {
      return this.cell.solution === this.display;
    },
    hintRole() {
      const hint = this.$root.hint;
      const number = +this.cell.clueNumber;

      if (hint.type === 'word') {
        if (hint.step >= 2 && number === hint.number) return 'target';
        if (hint.cells.includes(this.cell.id)) {
          if (hint.step >= 2) return 'evidence';
          return number === hint.repeat ? 'evidence' : 'target';
        }
        return 'dim';
      }

      if (hint.type === 'frequency') return number === hint.number ? 'target' : 'dim';
      if (hint.type === 'mistake' && hint.step === 2) return number === hint.number ? 'mistake' : 'dim';

      return null;
    },
    isAutoCheckedWrong() {
      return (
        !!this.$root.userPuzzleSettings.answersautocheck &&
        !this.isGridBeingChecked &&
        this.isCompleted &&
        !this.isCorrect &&
        this.$root.autoCheckPending !== +this.cell.clueNumber
      );
    },
    isGiven() {
      return (
        (this.cell.cluedata !== ' ' && this.cell.type === 'value') ||
        this.cell.cluedata === undefined
      );
    },
    isWordSelected() {
      return null;
    },
    display() {
      if (this.isBeingRevealed) {
        return this.cell.solution;
      } else if (this.isCompleted) {
        return this.$root.userString[parseInt(this.cell.clueNumber) - 1];
      } else {
        return this.cell.cluedata || '';
      }
    },
    clueNumber() {
      return this.cell.clueNumber;
    },
    notes() {
      return this.$root.user.notesArr[parseInt(this.cell.clueNumber)] || '';
    },
  },
  methods: {
    click() {
      app.vue.methods.resetActions();
      app.helpers.dispatchEvent('cellclick');
      
      if (!this.isGiven) {
        this.$root.setActiveItem('cells', this.cell.id, this.isGiven);
      }
    },
  },
});

</script>

<script>

  template: '<svg    id="pinch-zoom-image-2"   width="100%"    preserveAspectRatio="xMidYMin meet"    aria-labelledby="codewordGivenGridTitle"    aria-describedby="codewordGivenGridDescription"   xmlns="http://www.w3.org/2000/svg"    :viewBox="viewBox">   <title id="codewordGivenGridTitle" v-html="$root.lang.grid_title_given"></title>   <desc id="codewordGridDescription" v-html="$root.lang.grid_description_given"></desc>   <g role="table">     <g       class="row"       role="row"       v-for="(layoutRow, row) in layoutRows">       <component-given-cell         v-for="slot in layoutRow"         :row="slot.row"         :col="slot.col"         :idx="slot.col"         :cell="slot.cell"         :key="slot.cell.id">       </component-given-cell>     </g>      <g class="blank" aria-hidden="true" v-for="slot in emptySlots" :key="\'empty-\' + slot.row + \'-\' + slot.col">       <rect class="cell" :x="slot.col * 100" :y="slot.row * 100" width="100" height="100" shape-rendering="crispEdges"></rect>     </g>      <rect       class="grid"       :x="-gridBorderOffset"       :y="-gridBorderOffset"       :width="gridWidth + gridBorderOffset * 2"       :height="gridHeight + gridBorderOffset * 2"       :rx="gridRadius"       :ry="gridRadius"></rect>     <path vector-effect="non-scaling-stroke" class="grid-lines" :d="gridLines" />   </g> </svg>',
  props: ['item'],
  computed: {
    isColumn() {
      return this.$root.state.breakpoints.lg;
    },
    layoutRows() {
      const given = this.$root.puzzle.givenCells;

      if (!this.isColumn) {
        return given.map((cells, row) => cells.map((cell, col) => ({ cell, row, col })));
      }

      return given[0].map((_, row) => given.map((cells, col) => ({ cell: cells[row], row, col })).filter(slot => slot.cell));
    },
    gridWidth() {
      return Math.max(...this.layoutRows.map(row => row.length)) * 100;
    },
    emptySlots() {
      const cols = this.gridWidth / 100;
      const slots = [];

      this.layoutRows.forEach((row, rowIndex) => {
        for (let col = 0; col < cols; col++) {
          if (!row.some(slot => slot.col === col)) slots.push({ row: rowIndex, col });
        }
      });

      return slots;
    },
    gridHeight() {
      return this.layoutRows.length * 100;
    },
    gridBorderWidth() {
      return 14;
    },
    gridBorderOffset() {
      return this.gridBorderWidth / 2;
    },
    gridRadius() {
      return 12;
    },
    viewBox() {
      const pad = this.gridBorderWidth;
      return `${-pad} ${-pad} ${this.gridWidth + pad * 2} ${this.gridHeight + pad * 2}`;
    },
    gridLines() {
      let pathData = '';

      for (let i = 0; i < this.gridHeight; i += 100) {
        pathData += `M0,${i} L${this.gridWidth},${i} `;
      }

      for (let i = 0; i < this.gridWidth; i += 100) {
        pathData += `M${i},0 L${i},${this.gridHeight} `;
      }

      return pathData.trim();
    },
  },
});

</script>

<script>
vm.component('component-letter-tracker', {
  template: '<div class="letter-tracker" role="group" :aria-label="$root.lang.letters_title">   <ul class="letter-tracker__letters">     <li v-for="letter in letters" :key="letter">       <button         type="button"         class="letter-tracker__letter"         :class="{ used: isUsed(letter), \'just-used\': justUsed.includes(letter) }"         :aria-disabled="isUsed(letter) ? \'true\' : \'false\'"         :aria-label="isUsed(letter) ? usedLabel(letter) : letter"         @click.stop.prevent="enter(letter)">         <span class="letter-tracker__glyph" aria-hidden="true">{{ letter }}</span>       </button>     </li>   </ul> </div> ',
  data() {
    return {
      justUsed: [],
    };
  },
  computed: {
    letters() {
      return app.puzzle.allowed_values.split('');
    },
    usedLetters() {
      return this.letters.filter(letter => this.isUsed(letter));
    },
  },
  watch: {
    usedLetters(now, before) {
      const added = now.filter(letter => !before.includes(letter));

      if (!added.length) {
        return;
      }

      this.justUsed = [...this.justUsed, ...added];

      setTimeout(() => {
        this.justUsed = this.justUsed.filter(letter => !added.includes(letter));
      }, 600);
    },
  },
  methods: {
    isUsed(letter) {
      return this.$root.userString.includes(letter);
    },
    usedLabel(letter) {
      return (this.$root.lang.letters_used_aria || '').replaceAll('[[letter]]', letter);
    },
    enter(letter) {
      if (this.isUsed(letter) || this.$root.isCompletedWithoutErrors || this.$root.isCompletedReadOnly) {
        return;
      }

      app.vue.methods.resetActions();
      document.dispatchEvent(new CustomEvent('LetterEntered', { detail: { item: { item: { display: letter } } } }));
    },
  },
});

</script>

<script>
vm.component('component-keyboard-key', {
  template: '<li>   <button     :class="classes"     :data-key="item.tooltip ? item.display : item.event"     @click.stop.prevent="click"     @touchstart.stop.prevent="touchStart(); click()"     @touchend.stop.prevent="touchEnd"     v-html="item.display"   ></button> </li> ',
  props: ['item', 'idx'],
  data() {
    return {
      isActive: false,
    };
  },
  computed: {
    classes() {
      const classes = [];

      classes.push(`key ${this.item.tooltip ? 'key--primary' : 'key--secondary'}`);

      if (this.isActive) {
        classes.push('active');
      }

      if (this.isNotAllowed) {
        classes.push('not-allowed');
      }

      if (this.isUsed) {
        classes.push('used-up');
      }

      return classes;
    },
    isNotAllowed() {
      return app.puzzle.allowed_values.split('').indexOf(this.item.display) === -1;
    },
    isUsed() {
      return this.$root.userString.includes(this.item.display);
    },
  },
  methods: {
    click() {
      app.vue.methods.resetActions();

      if (!app.vue.model.isCompletedWithoutErrors && !app.vue.model.isCompletedReadOnly) {
        switch (this.item.event) {
          case 'delete':
            app.vue.methods.deleteClicked();
            app.emitter.emit('keyup-delete', 'todo', this.item.code);
            break;
          default:
            document.dispatchEvent(
              new CustomEvent('LetterEntered', this.$root.getEventData(this, 'keyboard-key'))
            );
            break;
        }
      }
    },
    touchStart() {
      return (this.isActive = true);
    },
    touchEnd() {
      return (this.isActive = false);
    },
    keyAZ(event, code, letter) {
      if (code === this.item.code) {
        this.click();
      }
    },
  },
  created() {
    app.emitter.on('keyup-az', this.keyAZ);
  },
});

</script>
