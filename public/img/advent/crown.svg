<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">Three peak advent cabinet crown</title>
  <desc id="desc">A simple mahogany crown with a tall central peak, two lower side peaks, restrained gold scrolls at the sides, and a broad empty centre for a logo and title without a plaque.</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#803b29"/><stop offset="1" stop-color="#602719"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0d184"/><stop offset=".55" stop-color="#c99a43"/><stop offset="1" stop-color="#ae7d2e"/></linearGradient>
    <g id="scroll" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M62 232C100 230 130 210 150 184C166 164 184 152 202 157C220 162 222 180 211 187C202 193 191 188 192 180" stroke-width="3"/>
      <path d="M140 211C170 222 199 214 211 200C224 184 220 172 214 167" stroke-width="2"/>
    </g>
  </defs>
  <!-- Broad centre is deliberately empty: position your logo and title here. -->
  <path d="M20 240C79 240 107 226 130 200C153 174 169 122 205 113C231 107 249 135 280 135C336 135 378 97 428 65C458 46 478 29 500 24C522 29 542 46 572 65C622 97 664 135 720 135C751 135 769 107 795 113C831 122 847 174 870 200C893 226 921 240 980 240Z" fill="url(#wood)" stroke="url(#gold)" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M57 232C98 228 121 213 140 192C163 165 178 127 206 123C230 121 248 145 280 145C341 145 385 106 434 74C465 54 482 40 500 35C518 40 535 54 566 74C615 106 659 145 720 145C752 145 770 121 794 123C822 127 837 165 860 192C879 213 902 228 943 232" fill="none" stroke="#c19448" stroke-width="1.1" opacity=".8"/>
  <use href="#scroll"/>
  <use href="#scroll" transform="translate(1000 0) scale(-1 1)"/>
  <path d="M20 240H980" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
</svg>
